name: Mirror to birdListenerTeach

on:
  push:
    branches: [master]
    tags: ["*"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to birdListenerTeach's upstream branch
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          # Pushed to "upstream", not "master": birdListenerTeach's own annotate
          # workflow rewrites "master" from this branch plus generated comments,
          # so master diverges from bird-listener's history. Mirroring straight
          # onto master would make this push non-fast-forward and fail once that
          # happens.
          git remote add teach "https://x-access-token:${MIRROR_PAT}@github.com/ohkaylul/birdListenerTeach.git"
          git push teach HEAD:refs/heads/upstream --force --tags

      - name: Open a notification issue in birdListenerTeach
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          # No automated annotation step -- this just flags that upstream has
          # new code, so a human can ask Claude to do the annotation pass by
          # hand in a session. Requires MIRROR_PAT to have "Issues: Read and
          # write" in addition to Contents and Workflows.
          SHA=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          BODY=$(jq -n --arg sha "$SHA" --arg msg "$MSG" \
            '{title: "New code from bird-listener ready for annotation (\($sha))",
              body: "bird-listener pushed **\($sha)**: \($msg)\n\nThe upstream branch here now has this code, unmodified. Ask Claude to review it and update the teaching comments on master."}')
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${MIRROR_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ohkaylul/birdListenerTeach/issues \
            -d "$BODY")
          cat response.json
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "Issue creation failed with HTTP $HTTP_CODE"
            exit 1
          fi
